<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar perfil | Social UNA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/login.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/perfil.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/editar_perfil.css') }}"
    >
</head>

<body>

    <div class="ambient-light light-one"></div>
    <div class="ambient-light light-two"></div>
    <div class="ambient-light light-three"></div>

    <main class="profile-container">

        <header class="profile-header">

            <a href="{{ url_for('perfil') }}" class="brand">
                <span class="brand-icon">S</span>
                <span>Social UNA</span>
            </a>

            <div class="top-actions">

                <span class="secure-label">
                    <span class="secure-dot"></span>
                    SESIÓN ACTIVA
                </span>

                <button
                    class="theme-toggle"
                    id="themeToggle"
                    type="button"
                    aria-label="Cambiar tema"
                >
                    <svg class="sun-icon" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor"
                         stroke-width="2">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42
                                 m11.3 11.3 1.42 1.42M2 12h2m16 0h2
                                 M4.93 19.07l1.42-1.42
                                 m11.3-11.3 1.42-1.42"/>
                    </svg>

                    <svg class="moon-icon" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor"
                         stroke-width="2">
                        <path d="M20.9 13A9 9 0 0 1 11 3.1
                                 9 9 0 1 0 20.9 13Z"/>
                    </svg>
                </button>

            </div>

        </header>

        <section class="profile-content">

            <div class="profile-heading">
                <span class="form-tag">CONFIGURACIÓN DE CUENTA</span>
                <h1>Editar perfil</h1>
                <p>Actualiza tu información personal.</p>
            </div>

            <div class="profile-card edit-profile-card">

                <div class="profile-identity">

                    <div class="profile-avatar">
                        {{ usuario.nombre[0] | upper }}
                    </div>

                    <div class="profile-user-info">
                        <h2>{{ usuario.nombre }}</h2>
                        <p>@{{ usuario.usuario }}</p>
                    </div>

                </div>

                <div class="profile-divider"></div>

                <h3 class="section-title">Información personal</h3>

                {% if error %}
                    <div class="error-message">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="POST"
                      action="{{ url_for('editar_perfil') }}">

                    <div class="form-group">
                        <label for="nombre">Nombre completo</label>

                        <div class="input-container">
                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                value="{{ usuario.nombre }}"
                                maxlength="100"
                                autocomplete="name"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="nombre_usuario">
                            Nombre de usuario
                        </label>

                        <div class="input-container">
                            <input
                                type="text"
                                id="nombre_usuario"
                                name="nombre_usuario"
                                value="{{ usuario.usuario }}"
                                maxlength="30"
                                autocomplete="username"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="correo">Correo electrónico</label>

                        <div class="input-container">
                            <input
                                type="email"
                                id="correo"
                                name="correo"
                                value="{{ usuario.correo }}"
                                maxlength="254"
                                autocomplete="email"
                                required
                            >
                        </div>
                    </div>

                    <div class="edit-profile-actions">

                        <button type="submit" class="login-button">
                            <span>Guardar cambios</span>
                        </button>

                        <a href="{{ url_for('perfil') }}"
                           class="cancel-edit">
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>

        </section>

        <footer class="profile-footer">
            © 2026 Social UNA · Tu comunidad universitaria
        </footer>

    </main>

    <script src="{{ url_for('static', filename='js/editar_perfil.js') }}"></script>

</body>
</html>
